<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goodboy</title>
    <style>
      html {
        --shell-chrome: oklch(0.17 0.006 255);
        --shell-primary: oklch(0.74 0.13 210);
        --shell-backdrop: radial-gradient(
          ellipse 70% 90% at 0% 0%,
          color-mix(in oklab, var(--shell-primary) 6%, transparent),
          transparent
        );
        background-color: var(--shell-chrome);
        background-image: var(--shell-backdrop);
        color-scheme: dark;
      }
      html[data-theme='light'] {
        --shell-chrome: oklch(0.952 0.005 250);
        --shell-primary: oklch(0.455 0.14 210);
        --shell-backdrop: radial-gradient(
          ellipse 70% 90% at 0% 0%,
          color-mix(in oklab, var(--shell-primary) 15%, transparent),
          transparent
        );
        color-scheme: light;
      }
      #boot-shell {
        background-color: var(--shell-chrome);
        background-image: var(--shell-backdrop);
        inset: 0;
        pointer-events: none;
        position: fixed;
      }
      #boot-shell i {
        background-color: #0b0b0d;
        border-radius: 23.52px;
        height: 84px;
        left: 50%;
        margin-left: -42px;
        position: absolute;
        top: calc(50% - 95px);
        width: 84px;
      }
      #boot-shell i::after {
        background-color: #fff;
        content: '';
        height: 63.84px;
        left: 10.08px;
        position: absolute;
        top: 10.08px;
        width: 63.84px;
        -webkit-mask: url(../../packages/ui/src/assets/mascot.png) center / contain no-repeat;
        mask: url(../../packages/ui/src/assets/mascot.png) center / contain no-repeat;
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('goodboy:theme');
          var systemIsLight =
            stored === 'system' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored === 'light' || systemIsLight ? 'light' : 'dark';
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="boot-shell"><i></i></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
