[package]
name = "kay-am-desktop"
version = "0.0.0"
description = "kAY.am desktop app"
authors = ["Amin Khayam"]
license = "MIT"
repository = "https://github.com/akhayam99/kay-am"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kay_am_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1" }
tauri-plugin-log = "2"
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
regex = "1"
sha2 = "0.10"
