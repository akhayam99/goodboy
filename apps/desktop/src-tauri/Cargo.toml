[package]
name = "goodboy-desktop"
version = "0.1.30"
description = "Goodboy desktop app"
authors = ["Amin Khayam"]
license = "MIT"
repository = "https://github.com/akhayam99/goodboy"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "goodboy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "6"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
libc = "0.2"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
snow = "0.9"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
