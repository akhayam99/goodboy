name: release cache

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/src-tauri/Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/release-cache.yml'
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: release-cache
  cancel-in-progress: false

jobs:
  macos:
    name: warm macos universal
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: read rust toolchain
        id: toolchain
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: cargo cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.channel }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.channel }}-

      - name: setup pnpm
        if: steps.cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4

      - name: setup node
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: setup rust
        if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: add macos targets
        if: steps.cache.outputs.cache-hit != 'true'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: install
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: build workspace deps
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm turbo run build --filter=@goodboy/desktop^...

      - name: build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm --filter @goodboy/desktop exec tauri build --target universal-apple-darwin --no-bundle --no-sign

      - name: drop the app crate from the cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo clean --locked --release --target "$target" -p goodboy-desktop --manifest-path apps/desktop/src-tauri/Cargo.toml
          done

  linux:
    name: warm linux bundles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: read rust toolchain
        id: toolchain
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: cargo cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.channel }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.channel }}-

      - name: install tauri system deps
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libdbus-1-dev pkg-config patchelf xdg-utils

      - name: setup pnpm
        if: steps.cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4

      - name: setup node
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: setup rust
        if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: install
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: build workspace deps
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm turbo run build --filter=@goodboy/desktop^...

      - name: build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm --filter @goodboy/desktop exec tauri build --no-bundle --no-sign

      - name: drop the app crate from the cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --locked --release -p goodboy-desktop --manifest-path apps/desktop/src-tauri/Cargo.toml
