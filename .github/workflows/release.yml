name: release

on:
  push:
    tags:
      - 'v*'

# Build the macOS universal (.dmg) on tag push and publish it as a draft
# GitHub Release. Signing + notarization run automatically when the APPLE_*
# secrets are present; if they are unset the build still produces an unsigned
# .dmg. The release body and the updater's latest.json notes both come from
# CHANGELOG.md. See docs/release.md.

permissions:
  contents: write

jobs:
  macos:
    name: build universal dmg
    runs-on: macos-14
    # Apple notarization can be slow, especially the first submission from a new
    # Developer ID account. Keep generous headroom so the runner does not get
    # killed mid-notarization.
    timeout-minutes: 90
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: extract release notes
        id: release_notes
        # Reads the section for this tag out of CHANGELOG.md (stripping an
        # -rc.N dry-run suffix first) and fails the build if it's missing, so
        # a release can no longer ship with an empty body. See CHANGELOG.md.
        run: |
          set -euo pipefail
          notes="$(node scripts/release-notes.mjs "$GITHUB_REF_NAME")"
          delimiter="RELEASE_NOTES_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "body<<$delimiter"
            echo "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: setup rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: add macos targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: read rust toolchain
        id: toolchain
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: restore cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.channel }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.channel }}-

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build workspace deps
        run: pnpm turbo run build --filter=@goodboy/desktop^...

      - name: build, release (universal)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOODBOY_BUILD_SHA: ${{ github.sha }}
          # Updater signing: tauri-action signs the update artifacts and emits
          # latest.json (attached to the release) so the in-app updater can
          # verify and apply new versions. Its "notes" field is releaseBody,
          # same string as the GitHub release body below.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Goodboy ${{ github.ref_name }}'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

  linux:
    name: build linux bundles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libdbus-1-dev pkg-config patchelf xdg-utils

      - name: setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: setup rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: read rust toolchain
        id: toolchain
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: restore cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.channel }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.channel }}-

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build workspace deps
        run: pnpm turbo run build --filter=@goodboy/desktop^...

      - name: build bundles
        env:
          GOODBOY_BUILD_SHA: ${{ github.sha }}
        run: pnpm --filter @goodboy/desktop exec tauri build --bundles appimage,deb,rpm --no-sign

      - name: upload bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goodboy-linux-bundles
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm

  attach:
    name: attach linux bundles to the draft
    runs-on: ubuntu-latest
    needs: [macos, linux]
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: download bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: goodboy-linux-bundles
          path: linux-bundles

      - name: find the draft
        id: draft
        run: |
          set -euo pipefail
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')
          count=$(printf '%s' "$found" | grep -c . || true)
          if [ "$count" != "1" ]; then
            echo "expected exactly one release for $TAG, found $count"
            exit 1
          fi
          if [ "${found#* }" != "true" ]; then
            echo "the release for $TAG is not a draft"
            exit 1
          fi
          echo "id=${found% *}" >> "$GITHUB_OUTPUT"

      - name: attach linux bundles
        run: |
          set -euo pipefail
          for pattern in '*.AppImage' '*.deb' '*.rpm'; do
            count=$(find linux-bundles -type f -name "$pattern" | wc -l | tr -d ' ')
            if [ "$count" != "1" ]; then
              echo "expected exactly one $pattern, found $count"
              exit 1
            fi
          done
          find linux-bundles -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 \
            | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber

      - name: check the draft holds every asset
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          names=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.assets[].name')
          printf '%s\n' "$names"
          for pattern in '\.dmg$' '\.app\.tar\.gz$' '\.app\.tar\.gz\.sig$' '^latest\.json$' '\.AppImage$' '\.deb$' '\.rpm$'; do
            if ! printf '%s\n' "$names" | grep -qE "$pattern"; then
              echo "the draft has no asset matching $pattern"
              exit 1
            fi
          done
