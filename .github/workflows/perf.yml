name: perf

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'bundle-budget.json'
      - '.github/workflows/perf.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: perf-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf:
    name: perf tests
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: perf tests
        run: pnpm test:perf

  bundle:
    name: bundle weight
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm --filter @goodboy/desktop exec vite build

      - name: check the bundle budget
        run: node scripts/check-bundle-budget.mjs

  audit:
    name: nightly audit
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: audit
        run: node scripts/audit-gate.mjs

  report:
    name: report perf failure
    needs: perf
    if: ${{ failure() && (github.event_name == 'schedule' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts

      - name: open or update the perf issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: perf
          TITLE: perf tests are failing
          MESSAGE: The perf tests failed on ${{ github.event_name }}.
        run: bash scripts/report-ci-issue.sh

  report-audit:
    name: report audit failure
    needs: audit
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts

      - name: open or update the security issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: security
          TITLE: a production dependency has a known advisory
          MESSAGE: The nightly pnpm audit found an advisory.
        run: bash scripts/report-ci-issue.sh
