name: rust

on:
  pull_request:
  push:
    paths:
      - 'apps/desktop/src-tauri/**'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: detect rust changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "__ERR__")
          if [ "$files" = "__ERR__" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^(apps/desktop/src-tauri/|\.github/workflows/rust\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: install tauri system deps
        if: steps.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4
        if: steps.changes.outputs.rust == 'true'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.changes.outputs.rust == 'true'
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: steps.changes.outputs.rust == 'true'
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: steps.changes.outputs.rust == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-check-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-check-${{ runner.os }}-

      - name: install
        if: steps.changes.outputs.rust == 'true'
        run: pnpm install --frozen-lockfile

      - name: build frontend
        if: steps.changes.outputs.rust == 'true'
        run: pnpm turbo run build --filter=@goodboy/desktop

      - name: fmt
        if: steps.changes.outputs.rust == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
        continue-on-error: true

      - name: clippy
        if: steps.changes.outputs.rust == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
        continue-on-error: true

      - name: test
        if: steps.changes.outputs.rust == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
