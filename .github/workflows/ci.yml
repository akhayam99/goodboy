name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      tests: ${{ steps.decide.outputs.tests }}
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: decide
        id: decide
        run: node scripts/ci-changes.mjs

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: setup workspace
        uses: ./.github/actions/setup-workspace

      - name: restore turbo cache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: cache turbo
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: typecheck
        run: pnpm turbo run typecheck

      - name: tauri commands
        run: pnpm run check:tauri-commands

      - name: doc refs
        run: pnpm run check:doc-refs

      - name: script tests
        run: pnpm run test:scripts

      - name: knip
        run: pnpm knip --include files,duplicates,unlisted,dependencies,devDependencies

      - name: knip production
        run: pnpm run knip:production

      - name: test shards cover every file
        run: node scripts/check-test-shards.mjs

      - name: build
        run: pnpm --filter @goodboy/desktop exec vite build

      - name: audit
        continue-on-error: true
        run: pnpm audit --prod

  test-desktop:
    name: desktop tests ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: setup workspace
        uses: ./.github/actions/setup-workspace

      - name: test
        run: pnpm --filter @goodboy/desktop exec vitest run --project unit --no-passWithNoTests --shard=${{ matrix.shard }}/4

  test-packages:
    name: packages tests + a11y
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: setup workspace
        uses: ./.github/actions/setup-workspace

      - name: test packages
        run: pnpm turbo run test --filter='./packages/*' --continue

      - name: a11y
        if: ${{ !cancelled() }}
        run: pnpm --filter @goodboy/desktop test:a11y

  gate:
    name: lint + typecheck + test + build
    needs: [changes, checks, test-desktop, test-packages]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts

      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs
