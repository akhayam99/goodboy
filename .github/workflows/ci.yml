name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      tests: ${{ steps.decide.outputs.tests }}
      scope: ${{ steps.decide.outputs.scope }}
      desktop_shards: ${{ steps.decide.outputs.desktop_shards }}
      zones: ${{ steps.decide.outputs.zones }}
      a11y: ${{ steps.decide.outputs.a11y }}
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: decide
        id: decide
        run: node scripts/ci-changes.mjs

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: setup workspace
        uses: ./.github/actions/setup-workspace

      - name: restore turbo cache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: cache turbo
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: typecheck
        run: pnpm turbo run typecheck

      - name: website deps
        run: pnpm install --ignore-workspace --dir website --frozen-lockfile

      - name: lint scope
        id: lint
        run: node scripts/ci-changes.mjs --lint

      - name: typed lint
        env:
          LINT: ${{ steps.lint.outputs.lint }}
          FILES: ${{ steps.lint.outputs.files }}
        run: |
          if [ "$LINT" = "all" ]; then
            pnpm run lint:ts
            exit 0
          fi
          printf '%s\n' "$FILES" | grep -v '^$' | tr '\n' '\0' | xargs -0 -r node --max-old-space-size=6144 node_modules/eslint/bin/eslint.js --no-warn-ignored

      - name: typed lint, strict pass
        env:
          LINT: ${{ steps.lint.outputs.lint }}
          FILES: ${{ steps.lint.outputs.files }}
        run: |
          if [ "$LINT" = "all" ]; then
            pnpm run lint:ts:strict
            exit 0
          fi
          printf '%s\n' "$FILES" | grep -v '^$' | tr '\n' '\0' | xargs -0 -r node --max-old-space-size=6144 node_modules/eslint/bin/eslint.js -c eslint.strict.config.mjs --suppressions-location eslint-suppressions-strict.json --no-warn-ignored

      - name: website token and icon drift
        run: pnpm --dir website run sync:tokens -- --check && pnpm --dir website exec node scripts/sync-icons.mjs --check

      - name: tauri commands
        run: pnpm run check:tauri-commands

      - name: doc refs
        run: pnpm run check:doc-refs

      - name: formatting of changed files
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD | grep -E '\.(ts|tsx|js|jsx|json|md|yml|yaml)$' | grep -v 'pnpm-lock.yaml$' || true)
          [ -z "$files" ] || echo "$files" | tr '\n' '\0' | xargs -0 pnpm exec prettier --check

      - name: forbidden patterns on the diff
        run: git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main && pnpm run check:rules

      - name: baselines only fall
        run: pnpm run check:baselines

      - name: script tests
        run: pnpm run test:scripts

      - name: knip
        run: pnpm knip --include files,duplicates,unlisted,dependencies,devDependencies

      - name: knip production
        run: pnpm run knip:production

      - name: test shards cover every file
        run: node scripts/check-test-shards.mjs

      - name: build
        run: pnpm --filter @goodboy/desktop exec vite build

      - name: lockfile changed
        id: lockfile
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qx pnpm-lock.yaml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: audit
        if: github.event_name == 'pull_request' && steps.lockfile.outputs.changed == 'true'
        timeout-minutes: 3
        run: node scripts/audit-gate.mjs

  commits:
    name: commit messages + pr title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: setup workspace
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: ./.github/actions/setup-workspace

      - name: commit messages
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "origin/$BASE_REF" --to "$HEAD_SHA"

      - name: pull request title
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  test-desktop:
    name: desktop tests ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.desktop_shards) }}
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: setup workspace
        uses: ./.github/actions/setup-workspace

      - name: test
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SCOPE" = "full" ]; then
            pnpm --filter @goodboy/desktop exec vitest run --project unit --no-passWithNoTests --shard="$SHARD"
            exit 0
          fi
          node scripts/ci-changes.mjs --desktop-tests > "$RUNNER_TEMP/related-tests"
          xargs -0 -s 1048576 -a "$RUNNER_TEMP/related-tests" pnpm --filter @goodboy/desktop exec vitest run --project unit --no-passWithNoTests --shard="$SHARD"

  test-time-zones:
    name: scene tests in ${{ matrix.zone }}
    needs: changes
    if: needs.changes.outputs.tests == 'true' && needs.changes.outputs.zones == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        zone: [Pacific/Kiritimati, Pacific/Pago_Pago, before-midnight, after-midnight]
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: setup workspace
        uses: ./.github/actions/setup-workspace

      - name: test
        env:
          ZONE: ${{ matrix.zone }}
          SCOPE: ${{ needs.changes.outputs.scope }}
        run: |
          export TZ="$(node scripts/test-time-zone.mjs "$ZONE")"
          echo "TZ=$TZ"
          if [ "$SCOPE" = "full" ]; then
            node scripts/scene-backed-tests.mjs | xargs pnpm --filter @goodboy/desktop exec vitest run --project unit --no-passWithNoTests
            exit 0
          fi
          node scripts/ci-changes.mjs --zone-tests > "$RUNNER_TEMP/related-tests"
          xargs -0 -s 1048576 -a "$RUNNER_TEMP/related-tests" pnpm --filter @goodboy/desktop exec vitest run --project unit --no-passWithNoTests

  test-packages:
    name: packages tests + a11y
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: setup workspace
        uses: ./.github/actions/setup-workspace

      - name: test packages
        run: pnpm turbo run test --filter='./packages/*' --continue

      - name: a11y
        if: ${{ !cancelled() && needs.changes.outputs.a11y == 'true' }}
        run: pnpm --filter @goodboy/desktop test:a11y --no-passWithNoTests

  gate:
    name: lint + typecheck + test + build
    needs: [changes, checks, commits, test-desktop, test-time-zones, test-packages]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts

      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs
