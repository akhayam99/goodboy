name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      tests: ${{ steps.decide.outputs.tests }}
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: decide
        id: decide
        run: node scripts/ci-changes.mjs

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: setup workspace
        uses: ./.github/actions/setup-workspace

      - name: restore turbo cache
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: cache turbo
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: typecheck
        run: pnpm turbo run typecheck

      - name: website token and icon drift
        run: pnpm --dir website run sync:tokens -- --check && pnpm --dir website exec node scripts/sync-icons.mjs --check

      - name: tauri commands
        run: pnpm run check:tauri-commands

      - name: doc refs
        run: pnpm run check:doc-refs

      - name: formatting of changed files
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD | grep -E '\.(ts|tsx|js|jsx|json|md|yml|yaml)$' | grep -v 'pnpm-lock.yaml$' || true)
          [ -z "$files" ] || echo "$files" | tr '\n' '\0' | xargs -0 pnpm exec prettier --check

      - name: forbidden patterns on the diff
        run: git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main && pnpm run check:rules

      - name: baselines only fall
        run: pnpm run check:baselines

      - name: script tests
        run: pnpm run test:scripts

      - name: knip
        run: pnpm knip --include files,duplicates,unlisted,dependencies,devDependencies

      - name: knip production
        run: pnpm run knip:production

      - name: test shards cover every file
        run: node scripts/check-test-shards.mjs

      - name: build
        run: pnpm --filter @goodboy/desktop exec vite build

      - name: audit
        id: audit
        continue-on-error: true
        timeout-minutes: 2
        run: pnpm audit --prod

      - name: audit warning
        if: steps.audit.outcome == 'failure'
        run: echo "::warning::pnpm audit --prod failed or timed out"

  commits:
    name: commit messages + pr title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: setup workspace
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: ./.github/actions/setup-workspace

      - name: commit messages
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "origin/$BASE_REF" --to "$HEAD_SHA"

      - name: pull request title
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  test-desktop:
    name: desktop tests ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: setup workspace
        uses: ./.github/actions/setup-workspace

      - name: test
        run: pnpm --filter @goodboy/desktop exec vitest run --project unit --no-passWithNoTests --shard=${{ matrix.shard }}/4

  test-packages:
    name: packages tests + a11y
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: setup workspace
        uses: ./.github/actions/setup-workspace

      - name: test packages
        run: pnpm turbo run test --filter='./packages/*' --continue

      - name: a11y
        if: ${{ !cancelled() }}
        run: pnpm --filter @goodboy/desktop test:a11y --no-passWithNoTests

  gate:
    name: lint + typecheck + test + build
    needs: [changes, checks, commits, test-desktop, test-packages]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts

      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs
