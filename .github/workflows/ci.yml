name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: install
        run: pnpm install --frozen-lockfile

      - name: resolve turbo base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TURBO_SCM_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            echo "TURBO_SCM_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi

      - name: lint
        run: pnpm turbo run lint --affected

      - name: typecheck
        run: pnpm turbo run typecheck --affected

      - name: knip
        run: pnpm knip --include files,duplicates,unlisted

      - name: test
        run: pnpm turbo run test --affected

      - name: build
        run: pnpm turbo run build --affected

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: audit
        run: pnpm audit --prod
