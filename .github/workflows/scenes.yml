name: scene measures

on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * *'
  pull_request:
    paths:
      - 'apps/desktop/src/**'
      - 'packages/ui/**'
      - 'scripts/validate-scenes.mjs'
      - 'scripts/validateScenes*.mjs'
      - '.github/workflows/scenes.yml'

permissions:
  contents: read

concurrency:
  group: scenes-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scenes:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 75 }}
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
      - name: setup workspace
        uses: ./.github/actions/setup-workspace
      - name: build mock bundle
        run: VITE_GOODBOY_MOCK=1 pnpm --filter @goodboy/desktop exec vite build --outDir "$RUNNER_TEMP/scenes-dist" --emptyOutDir
      - name: start preview
        run: |
          nohup pnpm --filter @goodboy/desktop exec vite preview --outDir "$RUNNER_TEMP/scenes-dist" --host 127.0.0.1 --port 5230 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/preview.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5230 > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5230 > /dev/null
      - name: chrome ready
        timeout-minutes: 5
        run: |
          chrome="$(command -v google-chrome)"
          VALIDATE_CHROME="$chrome" node scripts/validate-scenes.mjs --app http://127.0.0.1:5230 --ready-only
      - name: scene measures
        id: measures
        continue-on-error: true
        timeout-minutes: ${{ github.event_name == 'pull_request' && 22 || 65 }}
        env:
          SKIP: ${{ github.event_name == 'pull_request' && 'menus' || 'none' }}
        run: |
          VALIDATE_CHROME="$(command -v google-chrome)" node scripts/validate-scenes.mjs --app http://127.0.0.1:5230 --skip "$SKIP"
      - name: scene measures verdict
        if: always() && steps.measures.outcome == 'failure'
        run: |
          echo "::error title=scene measures::the measures step failed or timed out, see its log and the run summary"
      - name: stop preview
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/preview.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/preview.pid")" || true
          fi
