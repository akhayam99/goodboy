name: scene measures

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/src/**'
      - 'packages/ui/**'

permissions:
  contents: read

jobs:
  scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build mock bundle
        run: VITE_GOODBOY_MOCK=1 pnpm --filter @goodboy/desktop exec vite build --outDir "$RUNNER_TEMP/scenes-dist" --emptyOutDir
      - name: start preview
        run: |
          nohup pnpm --filter @goodboy/desktop exec vite preview --outDir "$RUNNER_TEMP/scenes-dist" --host 127.0.0.1 --port 5230 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/preview.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5230 > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5230 > /dev/null
      - name: chrome ready
        timeout-minutes: 5
        run: |
          chrome="$(command -v google-chrome)"
          VALIDATE_CHROME="$chrome" node scripts/validate-scenes.mjs --app http://127.0.0.1:5230 --ready-only
      - name: scene measures
        id: measures
        continue-on-error: true
        timeout-minutes: 25
        run: |
          VALIDATE_CHROME="$(command -v google-chrome)" node scripts/validate-scenes.mjs --app http://127.0.0.1:5230
      - name: scene measures verdict
        if: always() && steps.measures.outcome == 'failure'
        run: |
          echo "::error title=scene measures::the measures step failed or timed out, see its log and the run summary"
      - name: stop preview
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/preview.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/preview.pid")" || true
          fi
