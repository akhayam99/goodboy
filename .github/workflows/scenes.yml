name: scene measures

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/src/**'
      - 'packages/ui/**'

permissions:
  contents: read

jobs:
  scenes:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build mock bundle
        run: VITE_GOODBOY_MOCK=1 pnpm --filter @goodboy/desktop exec vite build --outDir "$RUNNER_TEMP/scenes-dist" --emptyOutDir
      - name: scene measures
        run: |
          pnpm --filter @goodboy/desktop exec vite preview --outDir "$RUNNER_TEMP/scenes-dist" --host 127.0.0.1 --port 5230 --strictPort &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5230 > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5230 > /dev/null
          status=0
          VALIDATE_CHROME="$(command -v google-chrome)" node scripts/validate-scenes.mjs --app http://127.0.0.1:5230 > "$RUNNER_TEMP/scenes.out" 2>&1 || status=$?
          cat "$RUNNER_TEMP/scenes.out"
          summary="$(grep '^scene measures:' "$RUNNER_TEMP/scenes.out" | tail -n 1 || true)"
          echo "${summary:-scene measures: failed}" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
