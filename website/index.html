      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Goodboy",
        "alternateName": "Goodboy shared context for coding agents",
        "description": "Goodboy is a local-first desktop app for running coding agents that keeps the thread. It carries shared context into every agent, lets an orchestrator pick each step, model, and effort at runtime, reviews pull requests and merge requests in one inbox, and tracks spend against the caps you set.",
        "url": "https://goodboy-ai.dev/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "macOS",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Open source under MIT license"
        },
        "author": {
          "@type": "Person",
          "name": "Amin Khayam",
          "url": "https://github.com/akhayam99"
        },
        "license": "https://opensource.org/licenses/MIT",
        "codeRepository": "https://github.com/akhayam99/goodboy",
        "keywords": [
          "shared context",
          "coding agents",
          "agent workflows",
          "multi-provider",
          "budget routing",
          "stage board",
          "local-first",
          "open source"
        ],
        "featureList": [
          "Shared context carried into every agent",
          "Orchestrated workflow runs with a step budget, drawn as a graph",
          "Provider, model, and effort chosen per step",
          "Fixed workflow sequences you can rerun",
          "Plans kept as artifacts",
          "Scout fan-out and plan clusters",
          "Stage board home with derived stages",
          "Review inbox for GitHub pull requests and GitLab merge requests",
          "Draft review comments published in one batch",
          "Resolver agents that answer a review comment with a local commit",
          "Studios for GitHub, GitLab, Linear, Jira, Sentry, and Slack",
          "Bitbucket Cloud pull requests with checks, diff, review verbs and merge",
          "Slack threads read and replied to, with reactions, from inside the app",
          "Impact Studio analytics on shipped work",
          "Unified model picker with families, versions, and effort",
          "Budget caps with a live cost meter",
          "Tool permission rules in beta",
          "Per-workspace markdown skills",
          "Syntax-highlighted diffs across a dozen languages",
          "GPU terminal on xterm 6",
          "Simple and composite workspaces",
          "Six providers in one session, only OpenRouter needs an API key"
        ]
      }
    </script>

    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Goodboy free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Goodboy is open source under the MIT license. It runs on the agent subscriptions and logins you already have."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need API keys?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No, except OpenRouter. Goodboy drives the command-line tools you already installed and signed into: Claude, Cursor, Codex, Google (Antigravity), and OpenCode. OpenRouter runs through the OpenCode runtime on an API key you provide."
            }
          },
          {
            "@type": "Question",
            "name": "Where do my credentials live?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your provider logins stay inside the CLI tools you already signed into. Any optional API key you add to Goodboy lives in your OS keychain, read at spawn and never written to disk."
            }
          },
          {
            "@type": "Question",
            "name": "Does my code leave my machine?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Goodboy itself is local-first: your sessions, history, and keys stay on your machine. The agents you run reach their own providers exactly as they do in your terminal."
            }
          },
          {
            "@type": "Question",
            "name": "Can I control what agents are allowed to do?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Tool rules let you allow, deny, or ask for each tool, at global, workspace, or session scope. A blocked call surfaces in the transcript and you can approve it inline. The feature is in beta, enforced on Claude sessions first."
            }
          },
          {
            "@type": "Question",
            "name": "Which platforms does Goodboy support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "macOS today, as a universal build or via Homebrew. Prebuilt binaries for Linux and Windows coming; you can build from source in the meantime, with a Rust toolchain."
            }
          },
          {
            "@type": "Question",
            "name": "Is there a mobile app?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Not a separate app. A beta companion pairs your phone with the desktop through a bridge: enough to spawn a workflow or merge a PR while you're away."
            }
          }
        ]
      }
    </script>
