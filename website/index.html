        },

        "codeRepository": "https://github.com/akhayam99/goodboy",
        "keywords": [
          "coding agents",
          "agent orchestrator",

          "session timeline",
          "notification inbox",
          "multi-provider",
          "worktrees",
          "budget caps",
          "open source",
          "local-first"
        ],
        "featureList": [
          "A briefing per task: goal, decisions and summary, read by every agent that touches it",
          "An orchestrator that picks the next agent, model and thinking effort",
          "Seven providers in one session: Claude, Codex, Cursor, Gemini, OpenCode, OpenRouter, Moonshot",
          "A stage board where every task shows building, running, needs you, in review or done",
          "A session timeline of what ran, what was decided and what needs you, and a notification inbox that carries the task on every row",
          "Agents as roles: scout, planner, implementer, reviewer, PR reviewer, resolver",
          "Cost per step, a budget per session that warns before the cap, and rerouting when a provider hits its limit",

          "Integrations for GitHub, GitLab, Bitbucket, Linear, Jira, Sentry and Slack, reachable by any agent through one bridge",

    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do I need to be a developer?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Goodboy is at its best on a code project, where you get a branch, a diff and a pull request out of every task. Point it at a plain folder and agents still work on it."
            }
          },
          {
            "@type": "Question",
            "name": "Is it really free, and what is the catch?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Free and open source, every feature included from the first launch. No account, no paid tier waiting for you further down."
            }
          },
          {
            "@type": "Question",
            "name": "Will it cost me anything on top of what I already pay?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No new bill. It works through the subscriptions you already have."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need to connect every provider?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "One is enough to start. Connect a second when you want to spread the work around, or to keep going after you hit a limit."
            }
          },
          {
            "@type": "Question",
            "name": "Where does my data go?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Everything the app knows about your work stays on your computer. Your prompts go straight from you to the provider you picked."
            }
          },
          {
            "@type": "Question",
            "name": "What if I do not like what the agents did?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You read the diff before anything lands. Agents open the pull request, merging waits for you."
            }
          },
          {
            "@type": "Question",
            "name": "Which platforms does it run on?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "macOS and Linux today. One build for Mac, packages for Linux."
            }
          }
        ]
      }
    </script>
