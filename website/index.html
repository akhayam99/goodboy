        },

        },
        "license": "https://opensource.org/licenses/MIT",
        "codeRepository": "https://github.com/akhayam99/goodboy",
        "keywords": [
          "shared context",

    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do I need to be a developer to use this?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The deep parts, worktrees, branches, diffs, pull requests, expect a git repository. Point Goodboy at one and you get the full flow. Point it at a plain folder instead and agents still run on it, just without worktrees, branches, or PRs."
            }
          },
          {
            "@type": "Question",
            "name": "Is it really free? What is the catch?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "MIT license, no paywall, no account, every feature included from the first launch. Nothing in the app is phoned home: what it tracks about your work stays in the file on your own computer. This website runs its own analytics; the app does not. The only thing you pay for is the subscription you already have."
            }
          },
          {
            "@type": "Question",
            "name": "Will this cost me anything on top of what I already pay?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No new bill. Goodboy runs on the Claude, Cursor, Codex, or other subscription you already have. The numbers you see in the app are what that work would have cost by the token, not a separate charge."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need API keys?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "For most providers, no. Claude, Cursor, Codex, Gemini and OpenCode reuse the login you already have with each CLI or app. OpenRouter and Moonshot are API-only, so those two need a key, kept in your OS keychain and never written to disk."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need to connect every provider to start?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. One connected CLI is enough to get going. Connect more later if you want to spread work across models or compare them on the same task."
            }
          },
          {
            "@type": "Question",
            "name": "Where does my data go?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Conversations, plans, decisions and PR state sit in a local SQLite file on your machine. The app itself has no backend and no account. Prompts and responses go straight from you to whichever provider you picked, the same path as running their CLI yourself."
            }
          },
          {
            "@type": "Question",
            "name": "What if I do not like what the agents did?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You read the diff before anything ships. Agents open a draft pull request; they never merge it themselves. If you want out of a session entirely, deleting it removes its branch and worktree too, so your main branch never sees it."
            }
          },
          {
            "@type": "Question",
            "name": "Which platforms does it run on?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "macOS and Linux. On a Mac it is one build for both Intel and Apple Silicon, or Homebrew if you prefer, and it keeps itself up to date. On Linux take the AppImage, the .deb or the .rpm, x86_64 on Ubuntu 24.04 or Debian 13 and newer, and pick up the next version from the release page yourself: updating in place is macOS only so far. Windows means building from source for now."
            }
          }
        ]
      }
    </script>
