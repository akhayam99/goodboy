    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do I need to be a developer?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Goodboy is at its best on a code project, where a task can end in a branch, a diff and a pull request. Point it at a plain folder and agents still work on it."
            }
          },
          {
            "@type": "Question",
            "name": "Is it really free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Goodboy is a free desktop app, with no account to create."
            }
          },
          {
            "@type": "Question",
            "name": "Will it cost me anything on top of what I already pay?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No new bill from Goodboy. Agents run on the providers you connect, with the plan or key you already have."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need to connect every provider?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "One is enough to start. Connect a second when you want to spread the work around, or to give a turn somewhere to go when the first one hits a limit."
            }
          },
          {
            "@type": "Question",
            "name": "Where does my data go?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Your tasks, decisions and settings stay on your computer. Your prompts go from you to the provider you picked."
            }
          },
          {
            "@type": "Question",
            "name": "What if I do not like what the agents did?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Agents open pull requests as drafts, and you read the diff before you merge."
            }
          },
          {
            "@type": "Question",
            "name": "Which platforms does it run on?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "macOS and Linux. Download the Mac app from this page, the Linux builds are on the release page."
            }
          }
        ]
      }
