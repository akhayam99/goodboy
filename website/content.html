<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem('goodboy-site:theme');
        } catch (e) {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>

    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () {
        window.dataLayer.push(arguments);
      };
      window.gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'denied',
        personalization_storage: 'denied',
        security_storage: 'granted',
        wait_for_update: 500,
      });
      window.goodboyConsent = { isMeasurementGranted: false, onPreference: function () {} };
    </script>
    <!-- Google Tag Manager, loaded only after the visitor accepts measurement -->
    <script>
      (function (w, d) {
        var GTM_ID = 'GTM-5NM3VX7Q';
        var consent = w.goodboyConsent;
        var isLoaded = false;
        var load = function () {
          if (isLoaded || !consent.isMeasurementGranted) return;
          isLoaded = true;
          w.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var first = d.getElementsByTagName('script')[0];
          var script = d.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtm.js?id=' + GTM_ID;
          first.parentNode.insertBefore(script, first);
        };
        var schedule = function () {
          if (w.requestIdleCallback) w.requestIdleCallback(load, { timeout: 4000 });
          else w.setTimeout(load, 2000);
        };
        var isAccepted = function (preference) {
          return !!preference && preference.isMeasurementGranted === true;
        };
        consent.onPreference = function (preference) {
          var isGranted = isAccepted(preference);
          consent.isMeasurementGranted = isGranted;
          w.gtag('consent', 'update', { analytics_storage: isGranted ? 'granted' : 'denied' });
          if (isGranted) {
            schedule();
            return;
          }
          if (isLoaded)
            w.setTimeout(function () {
              w.location.reload();
            }, 300);
        };
      })(window, document);
    </script>
    <!-- End Google Tag Manager -->

    <link
      rel="preload"
      href="/fonts/InterVariable-latin-v19.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--app-head-->

    <!-- Theme / PWA hints -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f11" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/pages/content/main.tsx"></script>
  </body>
</html>
